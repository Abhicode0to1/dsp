<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Brand gradient: indigo-600 -> violet-600 (diagonal) -->
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <!-- Cloud body: white -> faint indigo tint (gives the mark volume) -->
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6e9ff"/>
    </linearGradient>
    <!-- Soft drop shadow under the cloud (stdDeviation is in cloud-local units, pre-scale) -->
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.55"/>
    </filter>
  </defs>

  <!-- Full-bleed background (maskable-safe) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Cloud mark, centered within the maskable safe zone -->
  <g transform="translate(129 129) scale(10.6)">
    <!-- shadow -->
    <path transform="translate(0 0.7)" fill="#312e81" fill-opacity="0.33" filter="url(#shadow)"
      d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
    <!-- body -->
    <path fill="url(#cloud)"
      d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
  </g>
</svg>
